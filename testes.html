<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testes · Crônicas de The Witcher</title>
<style>
  body{margin:0;padding:20px;font-family:system-ui,sans-serif;background:#F4EEE1;color:#1E1710}
  h1{font-size:20px;margin:0 0 12px}
  li{margin:4px 0}
  .ok{color:#2F4A1F}.falha{color:#8C2A1B;font-weight:600}
  iframe{width:1200px;height:900px;border:1px solid #CDBE9C;margin-top:16px;background:#fff}
</style>
</head>
<body>
<h1 id="titulo">Rodando os testes…</h1>
<ol id="lista"></ol>
<pre id="resultado" hidden></pre>
<div id="palco"></div>
<script>
// Testes de ponta a ponta: cada um abre o app num iframe novo (com o navegador "limpo"),
// age como um leitor e confere o resultado. tools/testar.js roda esta página sem janela.
const sleep = ms => new Promise(r => setTimeout(r, ms));
const APP = 'Wiki%20The%20Witcher.dc.html';
let frame, doc;

async function abrir(hash, prep) {
  if (frame) frame.remove();
  frame = document.createElement('iframe');
  document.getElementById('palco').appendChild(frame);
  frame.contentWindow.localStorage.clear();
  if (prep) prep(frame.contentWindow.localStorage);
  frame.src = APP + (hash || '');
  await esperar(() => frame.contentDocument && frame.contentDocument.querySelector('nav button'), 20000, 'o app não carregou');
  doc = frame.contentDocument;
  await sleep(300);
}
async function esperar(cond, ms = 6000, msg = 'tempo esgotado') {
  const fim = Date.now() + ms;
  while (Date.now() < fim) { try { const v = cond(); if (v) return v; } catch (e) {} await sleep(50); }
  throw new Error(msg);
}
const texto = () => doc.body.innerText;
const botao = (t, dentro) => [...(dentro || doc).querySelectorAll('button')].find(b => b.textContent.trim() === t);
const clicar = async (t, dentro) => { const b = await esperar(() => botao(t, dentro), 4000, 'botão "' + t + '" não encontrado'); b.click(); await sleep(250); };
const digitar = async (input, v) => {
  const set = Object.getOwnPropertyDescriptor(frame.contentWindow.HTMLInputElement.prototype, 'value').set;
  input.focus(); set.call(input, v); input.dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true })); await sleep(300);
};
const confere = (cond, msg) => { if (!cond) throw new Error(msg); };

const TESTES = [
  ['A página inicial é a mesma para todo leitor', async () => {
    await abrir('');
    await esperar(() => /Comece por aqui/.test(texto()), 5000, 'a página inicial não apareceu');
    confere(!/Por onde você quer começar/.test(texto()), 'ainda pergunta o perfil do leitor');
    const g = [...doc.querySelectorAll('main button')].find(x => x.innerText.trim().startsWith('Geralt de Rívia'));
    g.click();
    await esperar(() => doc.querySelector('#verbete') && doc.querySelector('#verbete').innerText.includes('Gwynbleidd'), 4000, 'o verbete de Geralt não abriu');
  }],
  ['O filtro de fonte vale só na aba em que foi escolhido', async () => {
    await abrir('#/comp', ls => ls.setItem('witcher-prefs', JSON.stringify({ visitou: true })));
    const todos = () => +([...doc.querySelectorAll('main button')].map(b => b.innerText).find(t => /^Todos\s*\d/.test(t)) || '').replace(/\D/g, '');
    const antes = todos();
    await clicar('Livros', doc.querySelector('main'));
    confere(todos() < antes, 'o filtro "Livros" não reduziu o Compêndio (' + antes + ' × ' + todos() + ')');
    await clicar('História');
    await esperar(() => doc.getElementById('ev-tw3'), 3000, 'o filtro do Compêndio escondeu eventos de jogo na Linha do Tempo');
  }],
  ['A busca encontra pelo nome original', async () => {
    await abrir('#/tempo');
    await digitar(doc.querySelector('header input'), 'Beliefs of Skellige');
    await esperar(() => [...doc.querySelectorAll('header button')].some(b => /Crenças de Skellige/.test(b.innerText)), 3000, 'o título original não encontrou o escrito');
  }],
  ['A linha do tempo mostra todas as eras com seus eventos', async () => {
    await abrir('#/tempo');
    await esperar(() => texto().includes('Da Conjunção das Esferas'), 6000, 'título não apareceu');
    confere(doc.querySelectorAll('[id^="ev-"]').length >= 90, 'menos de 90 eventos na tela');
    // O texto da era (antes da lista de eventos) não revela o fim da saga com os spoilers recolhidos.
    const textoEra = () => { const s = doc.getElementById('era-guerras'); return (s.querySelector('.era-texto') || s.querySelector('p')).innerText; };
    confere(!/pogrom/i.test(textoEra()), 'o texto da era VII revela o fim com os spoilers recolhidos');
    await clicar('Spoilers recolhidos');
    confere(/pogrom/i.test(textoEra()), 'com os spoilers visíveis, o texto da era VII não conta o fim');
    confere(!doc.querySelector('.sc-logic-error'), 'erro de lógica do componente');
  }],
  ['Endereço de verbete abre o verbete', async () => {
    await abrir('#/comp/geralt');
    await esperar(() => doc.querySelector('#verbete') && doc.querySelector('#verbete').innerText.includes('Geralt de Rívia'), 6000, 'verbete não abriu');
  }],
  ['Endereço de evento abre a linha do tempo no evento', async () => {
    await abrir('#/tempo/@thanedd');
    await esperar(() => /Recolher/.test((doc.getElementById('ev-thanedd') || {}).innerText || ''), 6000, 'evento não abriu');
  }],
  ['A busca entende nomes dos jogos sem sugerir resultados errados', async () => {
    await abrir('#/tempo');
    const res = () => [...doc.querySelectorAll('header button')].map(b => b.innerText);
    await digitar(doc.querySelector('header input'), 'Crones');
    await esperar(() => res().some(t => t.includes('As Damas da Floresta')), 3000, '"Crones" não achou as Damas da Floresta');
    confere(!res().some(t => t.includes('Jarre')), '"Crones" ainda sugere Jarre');
    await digitar(doc.querySelector('header input'), 'Iris');
    await sleep(300);
    confere(!res().some(t => /\nTriss Merigold/.test('\n' + t.split('\n').slice(1).join('\n'))), '"Iris" ainda sugere Triss');
  }],
  ['A busca aceita erros de digitação', async () => {
    await abrir('#/tempo');
    await digitar(doc.querySelector('header input'), 'kaer mohren');
    await esperar(() => [...doc.querySelectorAll('header button')].some(b => b.innerText.includes('Kaer Morhen')), 3000, 'nenhum resultado para "kaer mohren"');
  }],
  ['Os spoilers ficam recolhidos para todo leitor e abrem com um clique', async () => {
    await abrir('#/tempo');
    const ev = await esperar(() => doc.getElementById('ev-pogrom'), 4000, 'o evento do Pogrom sumiu da linha do tempo');
    confere(/Spoiler de/.test(ev.innerText) && !ev.innerText.includes('O Pogrom de Rívia'), 'o Pogrom de Rívia aparece sem máscara');
    [...ev.querySelectorAll('span')].find(s => /Clique para mostrar/.test(s.textContent)).click(); await sleep(250);
    confere(doc.getElementById('ev-pogrom').innerText.includes('O Pogrom de Rívia'), 'o clique não revelou o evento');
    confere(doc.querySelectorAll('[id^="ev-"]').length >= 90, 'eventos sumiram da linha do tempo');
    await clicar('Spoilers recolhidos');
    confere(JSON.parse(frame.contentWindow.localStorage.getItem('witcher-leitura')).recolher === false, 'o botão do cabeçalho não mostrou os spoilers');
    confere(!/Spoiler de/.test(texto()), 'ainda há eventos mascarados com os spoilers visíveis');
  }],
  ['O guia de leitura guarda o progresso', async () => {
    await abrir('#/leitura');
    const li = await esperar(() => [...doc.querySelectorAll('main ol li')].find(l => l.innerText.includes('O Último Desejo')));
    li.querySelector('[role=checkbox]').click(); await sleep(200);
    confere(JSON.parse(frame.contentWindow.localStorage.getItem('witcher-leitura')).lidos.includes('o-ultimo-desejo'), 'progresso não foi salvo');
  }],
  ['Leitura por conto e expansões separadas', async () => {
    const aberto = (id) => { const e = doc.getElementById('ev-' + id); return e && !/Spoiler de/.test(e.innerText); };
    await abrir('#/tempo', ls => ls.setItem('witcher-leitura', JSON.stringify({ recolher: true, lidos: [], partes: { 'o-ultimo-desejo': [0] } })));
    await esperar(() => aberto('estrige'), 4000, 'o conto "O Bruxo" não abriu o spoiler da estrige');
    confere(!aberto('questao-preco'), '"Uma Questão de Preço" abriu sem o conto marcado');
    await abrir('#/tempo', ls => ls.setItem('witcher-leitura', JSON.stringify({ recolher: true, lidos: ['the-witcher-3'], partes: {} })));
    await esperar(() => aberto('geada-ciri'), 4000, 'The Witcher 3 não abriu seu spoiler');
    confere(!aberto('sangue-vinho'), 'Blood and Wine abriu sem a expansão marcada');
  }],
  ['O mapa desenha uma jornada', async () => {
    await abrir('#/mapa');
    await clicar('A jornada da Hansa');
    await esperar(() => doc.querySelector('main polyline'), 3000, 'sem traçado da jornada');
  }],
  ['O mapa aproxima e mostra as ilhas de Skellige', async () => {
    await abrir('#/mapa');
    const nomes = () => [...doc.querySelectorAll('main div[style*="aspect-ratio"] > div > button')].filter(b => b.innerText.trim()).length;
    const antes = nomes();
    await clicar('+'); await clicar('+');
    confere(nomes() > antes, 'o zoom não revelou mais nomes (' + antes + ' → ' + nomes() + ')');
    await clicar('Ilhas de Skellige');
    await esperar(() => [...doc.querySelectorAll('main button')].some(b => b.title === 'Undvik'), 3000, 'ilha de Undvik não apareceu');
    confere(doc.querySelectorAll('main svg polygon').length >= 6, 'ilhas não foram desenhadas');
  }],
  ['O lugar no mapa lista os escritos encontrados lá', async () => {
    await abrir('#/mapa');
    await clicar('Novigrad');
    await esperar(() => /Escritos encontrados aqui \(\d+\)/.test(texto()), 3000, 'sem lista de escritos de Novigrad');
  }],
  ['O verbete mostra em que obras aparece', async () => {
    await abrir('#/comp/yennefer');
    await esperar(() => [...doc.querySelectorAll('h2')].some(h => h.textContent.trim() === 'Aparece em'), 3000, 'sem "Aparece em"');
    const h = [...doc.querySelectorAll('h2')].find(h => h.textContent.trim() === 'Aparece em');
    confere(/O Último Desejo/.test(h.nextElementSibling.innerText), 'O Último Desejo não está entre as obras de Yennefer');
  }],
  ['A linha do tempo em escala mostra os pontos', async () => {
    await abrir('#/tempo');
    await clicar('Tudo', doc.querySelector('main'));
    const n = doc.querySelectorAll('main button[aria-label]').length;
    confere(n >= 90, 'só ' + n + ' pontos na escala');
  }],
  ['Livros × Jogos agrupa os avisos', async () => {
    await abrir('#/contraste');
    await esperar(() => /Divergências\s*\d+/.test(texto()), 4000, 'abas não apareceram');
    confere(doc.querySelectorAll('main section h3').length >= 10, 'faltam as grandes divergências');
    // Os rótulos aparecem em maiúsculas pelo CSS; o texto da página vem como "NOS LIVROS".
    confere(/nos livros/i.test(texto()) && /nos jogos/i.test(texto()), 'as divergências não estão lado a lado');
  }],
  ['A Linhagem troca de árvore', async () => {
    await abrir('#/linhagem');
    await clicar('Nilfgaard');
    await esperar(() => texto().includes('A casa var Emreis'), 3000, 'árvore de Nilfgaard não apareceu');
  }],
  ['Relações filtram por grupo e mostram a mudança dos laços', async () => {
    await abrir('#/rel');
    const nos = () => doc.querySelectorAll('main div[style*="aspect-ratio"] > button').length;
    confere(nos() >= 40, 'poucos personagens nos laços principais (' + nos() + ')');
    await clicar('A Hansa');
    confere(nos() === 6, 'o grupo da Hansa deveria ter 6 pessoas (' + nos() + ')');
    await clicar('Todos'); await clicar('Cahir');
    confere(!/Começa como/.test(doc.querySelector('main aside').innerText), 'o laço-spoiler Geralt–Cahir aparece com os spoilers recolhidos');
    await clicar('mostrar'); await clicar('Cahir');
    await esperar(() => /Começa como/.test(doc.querySelector('main aside').innerText), 3000, 'a mudança do laço com Cahir não apareceu');
  }],
  ['Conexões encontra o caminho entre dois verbetes', async () => {
    await abrir('#/rel');
    await clicar('Conexões');
    const [a, b] = doc.querySelectorAll('main input');
    const escolher = async (inp, q, nome) => { await digitar(inp, q); const bt = await esperar(() => [...doc.querySelectorAll('main button')].find(x => x.innerText.startsWith(nome)), 3000, 'sugestão ' + nome); bt.click(); await sleep(250); };
    await escolher(a, 'jaskier', 'Jaskier'); await escolher(b, 'eredin', 'Eredin');
    await esperar(() => /passos? de distância|ligados diretamente/.test(texto()), 3000, 'caminho não apareceu');
  }],
  ['O quiz faz uma rodada de 10 perguntas com resultado', async () => {
    await abrir('#/quiz');
    await clicar('Começar uma rodada');
    for (let i = 0; i < 10; i++) {
      const opts = await esperar(() => { const o = doc.querySelectorAll('main div[style*="grid"] button'); return o.length >= 2 && o; }, 3000, 'pergunta ' + (i + 1) + ' sem opções');
      opts[0].click(); await sleep(120);
      await esperar(() => /Acertou!|Era: /.test(texto()), 2000, 'sem resposta na pergunta ' + (i + 1));
      const prox = [...doc.querySelectorAll('main button')].find(b => /Próxima|resultado/.test(b.textContent));
      prox.click(); await sleep(150);
    }
    await esperar(() => /\d+ de 10/.test(texto()) && /Jogar de novo/.test(texto()), 3000, 'a rodada não terminou com resultado');
  }],
  ['O contrato de bruxo tem pistas que distinguem as criaturas', async () => {
    await abrir('#/quiz');
    await clicar('Contrato de bruxo');
    await esperar(() => doc.querySelector('main ul li'), 3000, 'contrato sem pistas');
    const pistas = [...doc.querySelectorAll('main ul li')].length;
    confere(pistas >= 2, 'contrato com uma pista só');
  }],
  ['Atalhos de teclado e favoritos', async () => {
    await abrir('#/comp/vesemir');
    const W = frame.contentWindow;
    W.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'f' })); await sleep(200);
    confere(JSON.parse(W.localStorage.getItem('witcher-prefs')).favs.includes('vesemir'), 'favorito não foi salvo');
    W.dispatchEvent(new W.KeyboardEvent('keydown', { key: '?' })); await sleep(200);
    confere(doc.querySelector('[role=dialog]'), 'janela de atalhos não abriu');
  }],
  ['O modo escuro inverte a página inteira', async () => {
    await abrir('#/tempo', ls => ls.setItem('witcher-prefs', JSON.stringify({ tema: 'escuro' })));
    const h = doc.documentElement, cs = frame.contentWindow.getComputedStyle(h);
    confere(h.dataset.tema === 'escuro' && /invert/.test(cs.filter), 'o filtro do modo escuro não foi aplicado');
    // O <body> tem altura zero; quem pinta o fundo é o <html>, que precisa ser claro para virar escuro.
    confere(cs.backgroundColor === 'rgb(244, 238, 225)', 'o fundo do <html> não é o pergaminho (' + cs.backgroundColor + ')');
  }],
  ['Nenhuma aba quebra no celular', async () => {
    frame && frame.remove();
    await abrir('#/tempo');
    frame.style.width = '375px'; await sleep(300);
    for (const aba of ['inicio', 'mapa', 'leitura', 'contraste', 'quiz', 'rel', 'comp', 'linhagem']) {
      frame.contentWindow.location.hash = '#/' + aba; await sleep(350);
      const sobra = doc.documentElement.scrollWidth - doc.documentElement.clientWidth;
      confere(sobra <= 1, 'a aba ' + aba + ' rola de lado (' + sobra + 'px)');
    }
  }]
];

(async () => {
  // Os testes limpam o armazenamento do site; o do leitor (progresso, favoritos) é guardado e devolvido no fim.
  const guardado = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); guardado[k] = localStorage.getItem(k); } } catch (e) {}
  const lista = document.getElementById('lista'), res = [];
  for (const [nome, fn] of TESTES) {
    const li = document.createElement('li'); li.textContent = nome + '…'; lista.appendChild(li);
    const t0 = Date.now();
    try { await fn(); res.push({ nome, ok: true, ms: Date.now() - t0 }); li.className = 'ok'; li.textContent = '✓ ' + nome; }
    catch (e) { res.push({ nome, ok: false, erro: e.message }); li.className = 'falha'; li.textContent = '✗ ' + nome + ' — ' + e.message; }
  }
  const falhas = res.filter(r => !r.ok).length;
  document.getElementById('titulo').textContent = falhas ? falhas + ' de ' + res.length + ' testes falharam' : 'Todos os ' + res.length + ' testes passaram';
  document.title = falhas ? 'FALHA' : 'OK';
  if (frame) frame.remove();
  try { localStorage.clear(); for (const [k, v] of Object.entries(guardado)) localStorage.setItem(k, v); } catch (e) {}
  const pre = document.getElementById('resultado'); pre.textContent = JSON.stringify(res); pre.dataset.pronto = '1';
})();
</script>
</body>
</html>
